name: CI

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm -d crm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgres://crm:crm@localhost:5432/crm?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # Go version matches docker/Dockerfile.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - run: go vet ./...

      # No separate build step: go test compiles every package.
      - run: go test ./...

      # pnpm and node versions match docker/Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: |
          pnpm install --frozen-lockfile
          pnpm test:run
          pnpm build
        working-directory: frontend
