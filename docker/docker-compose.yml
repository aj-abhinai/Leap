services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crm_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Point these at an existing PostgreSQL VM to use it instead of the bundled db service.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-crm}
      DB_PASSWORD: ${DB_PASSWORD:-crm}
      DB_NAME: ${DB_NAME:-crm}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@admin.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin}
    command: ["./crm", "--config", "config.toml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
