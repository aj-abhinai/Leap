# Production deployment. Bare `docker compose up` boots in production mode and
# FAILS FAST until real secrets are supplied via .env in this directory:
#
#   cp docker/.env.example docker/.env   # then fill in JWT_SECRET / SUPERADMIN_*
#   docker compose up -d
#
# The image ships the production config template (placeholders); config
# validation rejects them before the HTTP listener opens. No dev config is
# mounted and no demo credentials are accepted.
#
# Development uses the override instead (loopback binds, committed dev config):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d
services:
  app:
    image: crm/crm:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crm_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # DB connection points at the db service.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-crm}
      DB_PASSWORD: ${DB_PASSWORD:-crm}
      DB_NAME: ${DB_NAME:-crm}
      APP_ENV: ${APP_ENV:-production}
      # Comma-separated CIDRs of trusted reverse proxies. Leave empty when the
      # app is reached directly (the default) — client-supplied forwarded
      # headers are then ignored for rate limiting.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Required for a production boot. Empty values fall through to the
      # shipped template (placeholders), which startup validation rejects.
      JWT_SECRET: ${JWT_SECRET:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    command: ["./crm", "--config", "config.toml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.11-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    # No host port publish in production — Postgres is reachable only inside
    # the compose network. The dev override publishes it on 127.0.0.1.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
