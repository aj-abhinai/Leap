services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crm_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-crm}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@crm.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin}
    command: ["./crm", "--config", "config.toml"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
