# Development override — run together with the base compose file:
#
#   just docker-up
#   # => docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d
#
# Boots with the committed config.dev.toml: fixed bootstrap admin
# (admin@admin.com / admin) and the burned dev JWT secret, with all ports
# bound to 127.0.0.1. This is the only startup path where the hardcoded dev
# values are accepted — never use it in production.
services:
  app:
    environment:
      APP_ENV: development
      # The committed dev credentials: the base file leaves these empty
      # (production rejects that), and development must not need a docker/.env.
      DB_PASSWORD: ${DB_PASSWORD:-crm}
    # !override replaces the base compose's 0.0.0.0:9000 publish with a loopback
    # bind (compose merge would otherwise keep both mappings and conflict).
    ports: !override
      - "127.0.0.1:9000:9000"
    volumes:
      - ../config.dev.toml:/crm/config.toml:ro

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
    ports:
      - "127.0.0.1:5432:5432"

  # Database browser (pgweb) at http://127.0.0.1:8081, dev only: the
  # published Postgres port is loopback-scoped the same way.
  pgweb:
    image: sosedoff/pgweb:0.17.0
    container_name: crm_pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
